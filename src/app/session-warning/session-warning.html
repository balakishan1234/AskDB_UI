@if (showModal) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm px-4 select-none animate-fade-in">

    <div
      class="glass-panel border border-white/50 dark:border-white/10 shadow-2xl shadow-slate-300/40 rounded-3xl max-w-md w-full p-6 sm:p-8 transition-all duration-300 relative">

      <!-- Dynamic Brand gradient top bar -->
      <div
        class="absolute top-0 left-0 right-0 h-1 rounded-t-3xl bg-gradient-to-r from-blue-500 via-indigo-500 to-cyan-500 dark:from-amber-600 dark:via-orange-600 dark:to-yellow-500">
      </div>

      <!-- Modal Header -->
      <div class="flex justify-between items-start border-b border-slate-200/60 dark:border-slate-700/60 pb-4 mb-5">
        <div class="flex items-start gap-3">
          <div
            class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-500 dark:from-amber-600 dark:via-orange-600 dark:to-yellow-500 flex items-center justify-center shrink-0 shadow-md shadow-blue-500/20 dark:shadow-orange-500/20">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
              class="text-white animate-pulse">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </div>
          <div>
            <h3 class="text-base font-extrabold text-slate-900 dark:text-white tracking-tight">Session Inactivity Warning</h3>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1 font-semibold leading-relaxed max-w-[280px]">
              Your session will expire in <strong class="text-blue-600 dark:text-amber-500 text-sm font-black">{{ countdown }}</strong> seconds due to inactivity.
            </p>
          </div>
        </div>
      </div>

      <!-- Modal Body -->
      <div class="space-y-4">

        <!-- User Profile Lock Screen Avatar -->
        <div class="flex flex-col items-center justify-center py-2">
          <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-500 dark:from-amber-600 dark:via-orange-600 dark:to-yellow-500 flex items-center justify-center shadow-lg text-white font-extrabold text-xl mb-2.5 relative">
            <span>{{ userInitial }}</span>
            <span class="absolute bottom-0 right-0 w-4 h-4 rounded-full bg-orange-500 border-2 border-white dark:border-slate-900 animate-pulse"></span>
          </div>
          <h4 class="text-sm font-extrabold text-slate-800 dark:text-slate-200 tracking-tight">{{ userName }}</h4>
          <p class="text-[10px] text-slate-400 dark:text-slate-500 font-bold select-all tracking-wide">{{ userEmail }}</p>
        </div>

        <!-- Error Alert -->
        @if (errorMessage) {
          <div class="rounded-xl border border-red-200 bg-red-50/60 p-3.5 flex items-start gap-2.5 animate-wiggle">
            <div
              class="w-6 h-6 rounded-lg bg-red-100 border border-red-200 flex items-center justify-center shrink-0 mt-0.5">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-red-600" fill="none"
                viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <p class="text-xs text-red-800 font-semibold leading-relaxed">{{ errorMessage }}</p>
          </div>
        }

        <!-- Password Input -->
        <div class="space-y-2">
          <label
            class="flex items-center gap-1.5 text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-wider select-none">
            <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
              class="text-slate-400">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            Re-enter Password to Continue
          </label>
          <div class="relative">
            <input [type]="showPasswordText ? 'text' : 'password'" [(ngModel)]="password" name="password"
              placeholder="••••••••" [disabled]="isVerifying" (keydown.enter)="stayLoggedIn()"
              class="w-full px-4 py-3 rounded-xl modern-input text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 text-xs font-semibold shadow-sm outline-none pr-10 disabled:opacity-60 transition-all duration-200 bg-white/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800" />
            
            <button (click)="togglePasswordVisibility()" type="button"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 focus:outline-none cursor-pointer">
              <!-- Eye / Eye-off SVGs -->
              @if (showPasswordText) {
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-3 pt-2">
          <button (click)="logoutNow()" [disabled]="isVerifying"
            class="flex-1 py-3 px-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/70 dark:bg-slate-800/70 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold transition-all duration-150 text-xs cursor-pointer select-none">
            Logout
          </button>
          <button (click)="stayLoggedIn()" [disabled]="isVerifying"
            class="flex-1 py-3 px-4 rounded-xl btn-gradient text-white font-bold transition-all duration-150 text-xs cursor-pointer select-none flex items-center justify-center gap-1.5 shadow-md shadow-blue-500/10 dark:shadow-amber-500/10 hover:scale-[1.01] hover:-translate-y-0.5 active:scale-[0.98]">
            @if (isVerifying) {
              <svg class="animate-spin h-3.5 w-3.5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            }
            {{ isVerifying ? 'Verifying...' : 'Verify & Continue' }}
          </button>
        </div>

      </div>
    </div>
  </div>
}
