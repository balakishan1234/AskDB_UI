<!-- query-summary.html -->
<div class="space-y-4 p-5 bg-white rounded-xl border border-slate-200/90 shadow-2xs text-slate-800 font-sans">

  <!-- Header Banner -->
  <div class="flex items-center justify-between border-b border-slate-100 pb-3">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 rounded-lg bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      </div>
      <h3 class="text-xs font-bold text-slate-900 tracking-tight">AI Query Summary</h3>
    </div>
    <span class="text-[10px] font-semibold text-slate-400 bg-slate-50 border border-slate-100 px-2 py-0.5 rounded-full">
      Structured Insight
    </span>
  </div>

  <!-- User Input Query -->
  <div *ngIf="userQuestion" class="p-3 rounded-lg bg-slate-50/80 border border-slate-100 flex items-start gap-2.5">
    <span class="text-[11px] font-bold text-indigo-600 uppercase tracking-wider shrink-0 pt-0.5">Query:</span>
    <p class="text-xs font-medium text-slate-700 leading-relaxed italic">"{{ userQuestion }}"</p>
  </div>

  <!-- Executive Summary -->
  <div *ngIf="effectiveExecutiveSummary" class="space-y-1.5">
    <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
      Executive Summary
    </h4>
    <p class="text-xs font-medium text-slate-700 leading-relaxed pl-3 border-l-2 border-indigo-500">
      {{ effectiveExecutiveSummary }}
    </p>
  </div>

  <!-- Key Findings -->
  <div *ngIf="effectiveKeyFindingsList.length > 0" class="space-y-2 pt-0.5">
    <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
      Key Findings
    </h4>
    <div class="space-y-2 pl-3 border-l-2 border-amber-400">
      <div *ngFor="let item of effectiveKeyFindingsList" class="flex items-start gap-2.5 text-xs text-slate-700 leading-relaxed">
        <span class="inline-flex items-center justify-center shrink-0 w-4 h-4 rounded bg-amber-50 text-amber-600 font-bold text-[10px] border border-amber-200/80 mt-0.5">
          ✓
        </span>
        <span class="font-medium">{{ item }}</span>
      </div>
    </div>
  </div>

  <!-- Conclusion -->
  <div *ngIf="effectiveConclusion" class="space-y-1.5 pt-0.5">
    <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
      Conclusion
    </h4>
    <div class="p-3 rounded-lg bg-emerald-50/60 border border-emerald-100 text-xs font-semibold text-emerald-950 leading-relaxed">
      {{ effectiveConclusion }}
    </div>
  </div>

  <!-- Fallback Paragraph Summary -->
  <div *ngIf="!effectiveExecutiveSummary && summaryParagraphs.length > 0" class="space-y-2">
    <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Summary</h4>
    <p *ngFor="let para of summaryParagraphs" class="text-xs font-medium text-slate-700 leading-relaxed">
      {{ para }}
    </p>
  </div>

  <!-- Empty State -->
  <div
    *ngIf="!userQuestion && !effectiveExecutiveSummary && effectiveKeyFindingsList.length === 0 && !effectiveConclusion && summaryParagraphs.length === 0"
    class="py-6 text-center text-slate-400">
    <p class="text-xs font-medium">No analytical summary available for this query.</p>
  </div>

</div>
