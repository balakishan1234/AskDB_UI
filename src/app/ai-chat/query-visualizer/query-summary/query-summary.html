<!-- query-summary.html -->
<div class="space-y-4 p-4">

  <!-- ── User Question Card ─────────────────────────────────────────────── -->
  <div
    *ngIf="userQuestion"
    class="rounded-2xl border border-indigo-100 bg-gradient-to-r
           from-indigo-50 to-blue-50/60 p-4 flex items-start gap-3">

    <!-- Icon -->
    <div
      class="shrink-0 w-8 h-8 rounded-xl bg-indigo-100 border border-indigo-200
             flex items-center justify-center text-indigo-600">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
        viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </div>

    <div class="min-w-0 flex-1">
      <p class="text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-1">
        Your Question
      </p>
      <p class="text-sm font-semibold text-indigo-900 leading-relaxed">
        "{{ userQuestion }}"
      </p>
    </div>
  </div>

  <!-- ── AI Explanation Card ────────────────────────────────────────────── -->
  <div
    *ngIf="explanation"
    class="rounded-2xl border border-slate-200/80 bg-white p-4
           flex items-start gap-3 shadow-sm">

    <!-- Icon -->
    <div
      class="shrink-0 w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600
             via-indigo-600 to-cyan-500 flex items-center justify-center
             text-white shadow-sm">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13"
        viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813
                 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1
                 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
      </svg>
    </div>

    <div class="min-w-0 flex-1">
      <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">
        AI Explanation
      </p>
      <p class="text-[13px] text-slate-700 leading-relaxed font-medium">
        {{ explanation }}
      </p>
    </div>
  </div>

  <!-- ── Empty State ────────────────────────────────────────────────────── -->
  <div
    *ngIf="!explanation && !userQuestion"
    class="flex flex-col items-center justify-center py-10 text-center
           text-slate-400 select-none">
    <div
      class="w-10 h-10 rounded-xl bg-slate-100 border border-slate-200
             flex items-center justify-center mb-3">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
        viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>
    <p class="text-[11px] font-bold">No summary available.</p>
    <p class="text-[10px] mt-1">Run a query first to see the summary.</p>
  </div>

</div>
