<!-- query-summary.html -->
<div class="space-y-4 p-4 md:p-5 bg-white rounded-xl border border-slate-200/80 shadow-xs">

  <!-- ── 1. User Input Question ─────────────────────────────────────────── -->
  <div *ngIf="userQuestion" class="pb-3 border-b border-slate-100">
    <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">User Question</div>
    <p class="text-sm font-semibold text-slate-800 italic">"{{ userQuestion }}"</p>
  </div>

  <!-- ── 2. Executive Summary ───────────────────────────────────────────── -->
  <div *ngIf="effectiveExecutiveSummary" class="space-y-1.5">
    <div class="flex items-center gap-1.5 text-xs font-bold text-slate-700">
      <span class="w-2 h-2 rounded-full bg-blue-600"></span>
      <span>Executive Summary</span>
    </div>
    <p class="text-xs text-slate-600 leading-relaxed pl-3.5 border-l-2 border-blue-500">
      {{ effectiveExecutiveSummary }}
    </p>
  </div>

  <!-- ── 3. Key Findings ────────────────────────────────────────────────── -->
  <div *ngIf="effectiveKeyFindingsList.length > 0" class="space-y-2 pt-1">
    <div class="flex items-center gap-1.5 text-xs font-bold text-slate-700">
      <span class="w-2 h-2 rounded-full bg-amber-500"></span>
      <span>Key Findings</span>
    </div>
    <ul class="space-y-2 pl-3.5 border-l-2 border-amber-400">
      <li *ngFor="let item of effectiveKeyFindingsList" class="text-xs text-slate-600 leading-relaxed flex items-start gap-2">
        <span class="text-amber-500 font-bold shrink-0">•</span>
        <span>{{ item }}</span>
      </li>
    </ul>
  </div>

  <!-- ── 4. Conclusion ──────────────────────────────────────────────────── -->
  <div *ngIf="effectiveConclusion" class="space-y-1.5 pt-1">
    <div class="flex items-center gap-1.5 text-xs font-bold text-slate-700">
      <span class="w-2 h-2 rounded-full bg-emerald-600"></span>
      <span>Conclusion</span>
    </div>
    <p class="text-xs font-medium text-slate-700 leading-relaxed pl-3.5 border-l-2 border-emerald-500 bg-emerald-50/50 p-2.5 rounded-r-lg">
      {{ effectiveConclusion }}
    </p>
  </div>

  <!-- ── 5. Detailed Summary Fallback ──────────────────────────────────── -->
  <div *ngIf="!effectiveExecutiveSummary && summaryParagraphs.length > 0" class="space-y-2">
    <div class="text-xs font-bold text-slate-700">Summary</div>
    <p *ngFor="let para of summaryParagraphs" class="text-xs text-slate-600 leading-relaxed">
      {{ para }}
    </p>
  </div>

  <!-- ── Empty State ────────────────────────────────────────────────────── -->
  <div
    *ngIf="!userQuestion && !effectiveExecutiveSummary && effectiveKeyFindingsList.length === 0 && !effectiveConclusion && summaryParagraphs.length === 0"
    class="py-8 text-center text-slate-400">
    <p class="text-xs font-medium">No summary available for this query.</p>
  </div>

</div>
