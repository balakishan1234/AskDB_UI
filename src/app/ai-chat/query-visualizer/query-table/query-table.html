<div class="space-y-5">
  <!-- Toolbar -->
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between select-none">
    <div class="relative w-full sm:max-w-sm">
      <label for="recordSearch" class="sr-only">Filter records</label>

      <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
        <svg
          class="h-4 w-4"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.25"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
      </span>

      <input
        id="recordSearch"
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Filter records in view..."
        class="w-full pl-10 pr-4 py-2.5 bg-white/60 border border-slate-200/80 rounded-xl text-xs font-semibold text-slate-700 placeholder-slate-400 shadow-sm transition-all outline-none focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-500/10 hover:border-slate-300"
      />
    </div>

    <div class="inline-flex items-center rounded-full border border-slate-200/70 bg-white/60 px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-[0.18em] text-slate-500 shadow-sm">
      Showing {{ filteredAndSortedResults.length }} of {{ results.length }} rows
    </div>
  </div>

  <!-- Table Wrapper -->
  <div class="overflow-hidden rounded-2xl border border-slate-200/60 bg-white/70 backdrop-blur-md shadow-sm">
    <div class="overflow-x-auto light-scrollbar">
      <table class="w-full min-w-[480px] border-collapse text-left">
        <thead class="bg-slate-50/80 border-b border-slate-200/60">
          <tr class="select-none">
            <th
              *ngFor="let col of columns"
              (click)="changeSort(col)"
              class="group px-5 py-3.5 text-[10px] font-extrabold uppercase tracking-[0.16em] text-slate-500 cursor-pointer transition-colors hover:bg-slate-100/60 hover:text-slate-800"
            >
              <div class="flex items-center gap-2">
                <span>{{ col }}</span>

                <span
                  class="inline-flex items-center justify-center text-slate-400 group-hover:text-slate-600 transition-colors"
                  *ngIf="sortColumn === col"
                >
                  <svg
                    *ngIf="sortDirection === 'asc'; else descIcon"
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-3 w-3"
                    viewBox="0 0 20 20"
                    fill="currentColor"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M10 5l4 6H6l4-6z"
                      clip-rule="evenodd"
                    />
                  </svg>

                  <ng-template #descIcon>
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      class="h-3 w-3"
                      viewBox="0 0 20 20"
                      fill="currentColor"
                    >
                      <path
                        fill-rule="evenodd"
                        d="M10 15l-4-6h8l-4 6z"
                        clip-rule="evenodd"
                      />
                    </svg>
                  </ng-template>
                </span>
              </div>
            </th>
          </tr>
        </thead>

        <tbody>
          <tr
            *ngFor="let row of filteredAndSortedResults"
            class="border-b border-slate-100/70 odd:bg-white/40 even:bg-slate-50/30 hover:bg-slate-50/80 transition-colors"
          >
            <td
              *ngFor="let col of columns"
              class="px-5 py-3.5 text-xs font-semibold font-mono text-slate-700 whitespace-nowrap"
            >
              {{ row[col] }}
            </td>
          </tr>

          <tr *ngIf="filteredAndSortedResults.length === 0">
            <td
              [attr.colspan]="columns.length"
              class="px-6 py-12 text-center"
            >
              <div class="flex flex-col items-center justify-center gap-2 text-slate-400">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M9 17v-2a4 4 0 014-4h6m0 0l-3-3m3 3l-3 3M5 7h14M5 12h5M5 17h3"
                  />
                </svg>
                <span class="text-xs font-bold">No matching records found.</span>
                <span class="text-[11px] font-medium text-slate-400/90">
                  Try adjusting your filter or clearing the search.
                </span>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
