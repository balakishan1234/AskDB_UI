<header class="sticky top-0 z-40 w-full glass-panel border-b border-slate-200 dark:border-slate-800/80 transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Brand Logo -->
      <a routerLink="/" class="flex items-center gap-2.5 group">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-500 flex items-center justify-center shadow-md shadow-blue-500/20 group-hover:scale-105 transition-transform duration-300">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" />
          </svg>
        </div>
        <div class="flex flex-col">
          <div class="flex items-center gap-1.5">
            <span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white font-display">Ask<span class="text-blue-500">DB</span></span>
            <span class="text-[10px] uppercase font-extrabold tracking-wider bg-blue-500/10 dark:bg-blue-400/20 text-blue-600 dark:text-blue-400 border border-blue-500/20 px-1.5 py-0.5 rounded-full">Enterprise</span>
          </div>
        </div>
      </a>

      <!-- Desktop Nav Links -->
      <nav class="hidden md:flex items-center gap-1">
        <a routerLink="/features" routerLinkActive="bg-blue-500/10 text-blue-600 dark:text-blue-400 font-semibold" class="px-3.5 py-2 rounded-lg text-sm text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors">
          Features
        </a>
        <a routerLink="/security" routerLinkActive="bg-blue-500/10 text-blue-600 dark:text-blue-400 font-semibold" class="px-3.5 py-2 rounded-lg text-sm text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors">
          Security
        </a>
        <a routerLink="/pricing" routerLinkActive="bg-blue-500/10 text-blue-600 dark:text-blue-400 font-semibold" class="px-3.5 py-2 rounded-lg text-sm text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors">
          Pricing
        </a>
        <a routerLink="/about" routerLinkActive="bg-blue-500/10 text-blue-600 dark:text-blue-400 font-semibold" class="px-3.5 py-2 rounded-lg text-sm text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors">
          About
        </a>
      </nav>

      <!-- Right Actions: Command Palette, Theme, Request Access, Sign In -->
      <div class="hidden md:flex items-center gap-2.5">
        
        <!-- Command Palette Trigger Button -->
        <button (click)="triggerCommandPalette()" type="button" class="flex items-center gap-2 px-3 py-1.5 text-xs text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800/80 hover:bg-slate-200 dark:hover:bg-slate-700/80 border border-slate-200 dark:border-slate-700 rounded-lg transition-all shadow-sm">
          <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <span>Search...</span>
          <kbd class="px-1.5 py-0.5 text-[10px] font-semibold bg-white dark:bg-slate-900 text-slate-400 dark:text-slate-500 border border-slate-200 dark:border-slate-700 rounded shadow-xs">Ctrl K</kbd>
        </button>

        <!-- Theme Toggle -->
        <button (click)="toggleTheme()" type="button" class="p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/80 transition-colors" title="Toggle Theme">
          <svg *ngIf="themeService.currentTheme() === 'dark'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg *ngIf="themeService.currentTheme() !== 'dark'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>

        <!-- Sign In / Workspace -->
        <a *ngIf="!authService.isLoggedIn()" routerLink="/login" class="px-3.5 py-2 text-sm font-medium text-slate-700 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
          Sign In
        </a>

        <a *ngIf="authService.isLoggedIn()" routerLink="/work-space" class="px-3.5 py-2 text-sm font-medium text-white bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 rounded-lg transition-colors">
          Console
        </a>

        <!-- Request Access Primary CTA -->
        <a routerLink="/request-access" class="px-4 py-2 text-sm font-semibold text-white rounded-lg btn-gradient shadow-md shadow-blue-500/20 hover-lift flex items-center gap-1.5">
          <span>Request Access</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </a>
      </div>

      <!-- Mobile Hamburger Menu Button -->
      <div class="flex items-center gap-2 md:hidden">
        <button (click)="toggleTheme()" type="button" class="p-2 rounded-lg text-slate-500 dark:text-slate-400">
          <svg *ngIf="themeService.currentTheme() === 'dark'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg *ngIf="themeService.currentTheme() !== 'dark'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
        </button>

        <button (click)="toggleMobileMenu()" type="button" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
          <svg *ngIf="!isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <svg *ngIf="isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  <div *ngIf="isMobileMenuOpen" class="md:hidden glass-panel border-t border-slate-200 dark:border-slate-800 px-4 pt-2 pb-6 space-y-3 animate-fade-in">
    <button (click)="triggerCommandPalette()" type="button" class="w-full flex items-center justify-between px-3.5 py-2.5 text-sm text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800/80 rounded-lg">
      <span class="flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        Search Command Palette...
      </span>
      <kbd class="px-1.5 py-0.5 text-xs bg-white dark:bg-slate-900 border rounded">Ctrl+K</kbd>
    </button>

    <div class="flex flex-col gap-1">
      <a routerLink="/features" (click)="closeMobileMenu()" class="px-3.5 py-2 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">Features</a>
      <a routerLink="/security" (click)="closeMobileMenu()" class="px-3.5 py-2 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">Security</a>
      <a routerLink="/pricing" (click)="closeMobileMenu()" class="px-3.5 py-2 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">Pricing</a>
      <a routerLink="/about" (click)="closeMobileMenu()" class="px-3.5 py-2 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">About</a>
      <a routerLink="/contact" (click)="closeMobileMenu()" class="px-3.5 py-2 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">Contact</a>
    </div>

    <div class="pt-3 border-t border-slate-200 dark:border-slate-800/80 flex flex-col gap-2">
      <a *ngIf="!authService.isLoggedIn()" routerLink="/login" (click)="closeMobileMenu()" class="w-full text-center py-2.5 text-sm font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 rounded-lg">Sign In</a>
      <a routerLink="/request-access" (click)="closeMobileMenu()" class="w-full text-center py-2.5 text-sm font-semibold text-white btn-gradient rounded-lg shadow-md">Request Access</a>
    </div>
  </div>
</header>
