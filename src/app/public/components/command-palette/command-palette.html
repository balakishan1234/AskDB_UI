<div *ngIf="isOpen" class="fixed inset-0 z-50 overflow-y-auto p-3 sm:p-6 md:p-12 flex items-start sm:items-center justify-center">
  
  <!-- Backdrop Blur -->
  <div (click)="closePalette()" class="fixed inset-0 bg-slate-900/50 dark:bg-slate-950/80 backdrop-blur-md transition-opacity"></div>

  <!-- Command Palette Glass Modal Window -->
  <div class="relative w-full max-w-xl sm:max-w-2xl bg-white/95 dark:bg-[#101722]/95 backdrop-blur-2xl rounded-2xl sm:rounded-3xl shadow-2xl overflow-hidden border border-slate-200/90 dark:border-slate-800/90 animate-slide-up my-auto">
    
    <!-- Top Accent Gradient Line -->
    <div class="h-1 bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500"></div>

    <!-- Input Header -->
    <div class="flex items-center px-4 sm:px-5 py-3.5 sm:py-4 border-b border-slate-200/80 dark:border-slate-800/80 bg-slate-50/80 dark:bg-[#0a0e14]/60">
      <div class="w-8 h-8 rounded-xl bg-blue-500/10 text-blue-500 flex items-center justify-center shrink-0 mr-3">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>

      <input 
        #searchInput
        [(ngModel)]="searchQuery" 
        (ngModelChange)="selectedIndex = 0"
        placeholder="Search pages, commands, FAQs..."
        class="w-full bg-transparent text-slate-900 dark:text-white placeholder-slate-400 text-sm sm:text-base focus:outline-none font-medium"
        autofocus
      />

      <button (click)="closePalette()" type="button" class="sm:hidden p-1.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <kbd class="hidden sm:inline-flex items-center gap-1 px-2 py-1 text-[10px] font-extrabold bg-slate-200/80 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-300 dark:border-slate-700 rounded-md shadow-xs shrink-0">ESC</kbd>
    </div>

    <!-- Command List Container -->
    <div class="max-h-[55vh] sm:max-h-[380px] overflow-y-auto custom-scrollbar p-2 sm:p-3 space-y-1">
      
      <!-- Empty Search State -->
      <div *ngIf="filteredCommands.length === 0" class="py-12 px-6 text-center text-slate-400 space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center mx-auto text-slate-400 text-xl">
          🔍
        </div>
        <p class="text-sm font-semibold text-slate-700 dark:text-slate-300">No matching commands found for "<span class="text-blue-500">{{ searchQuery }}</span>"</p>
        <p class="text-xs text-slate-500">Try searching for "Pricing", "Security", or "Request Access".</p>
      </div>

      <!-- Command Item Button -->
      <button
        *ngFor="let item of filteredCommands; let i = index"
        (click)="executeCommand(item)"
        (mouseenter)="selectedIndex = i"
        type="button"
        [class.bg-gradient-to-r]="selectedIndex === i"
        [class.from-blue-600]="selectedIndex === i"
        [class.via-indigo-600]="selectedIndex === i"
        [class.to-cyan-600]="selectedIndex === i"
        [class.text-white]="selectedIndex === i"
        [class.shadow-md]="selectedIndex === i"
        [class.shadow-blue-500\/20]="selectedIndex === i"
        [class.hover:bg-slate-100\/80]="selectedIndex !== i"
        [class.dark:hover:bg-[#182331]\/80]="selectedIndex !== i"
        class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-left transition-all duration-150 text-xs sm:text-sm group cursor-pointer"
      >
        <div class="flex items-center gap-3 min-w-0">
          
          <!-- Icon Container -->
          <div 
            [class.bg-white\/20]="selectedIndex === i" 
            [class.bg-slate-100]="selectedIndex !== i"
            [class.dark:bg-slate-800]="selectedIndex !== i"
            class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl flex items-center justify-center shrink-0 transition-colors"
          >
            <!-- SVG Icon map based on item.icon -->
            <svg *ngIf="item.icon === 'home'" class="w-4 h-4" [class.text-white]="selectedIndex === i" [class.text-blue-500]="selectedIndex !== i" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>

            <svg *ngIf="item.icon === 'user-plus'" class="w-4 h-4" [class.text-white]="selectedIndex === i" [class.text-indigo-500]="selectedIndex !== i" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
            </svg>

            <svg *ngIf="item.icon === 'tag'" class="w-4 h-4" [class.text-white]="selectedIndex === i" [class.text-cyan-500]="selectedIndex !== i" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
            </svg>

            <svg *ngIf="item.icon === 'sparkles'" class="w-4 h-4" [class.text-white]="selectedIndex === i" [class.text-purple-500]="selectedIndex !== i" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
            </svg>

            <svg *ngIf="item.icon === 'shield'" class="w-4 h-4" [class.text-white]="selectedIndex === i" [class.text-emerald-500]="selectedIndex !== i" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>

            <svg *ngIf="item.icon === 'moon'" class="w-4 h-4" [class.text-white]="selectedIndex === i" [class.text-amber-500]="selectedIndex !== i" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>

            <svg *ngIf="item.icon === 'lock'" class="w-4 h-4" [class.text-white]="selectedIndex === i" [class.text-blue-500]="selectedIndex !== i" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>

            <svg *ngIf="item.icon === 'document'" class="w-4 h-4" [class.text-white]="selectedIndex === i" [class.text-indigo-500]="selectedIndex !== i" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>

            <svg *ngIf="item.icon === 'mail'" class="w-4 h-4" [class.text-white]="selectedIndex === i" [class.text-cyan-500]="selectedIndex !== i" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>

            <svg *ngIf="item.icon === 'activity'" class="w-4 h-4" [class.text-white]="selectedIndex === i" [class.text-emerald-500]="selectedIndex !== i" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>

            <svg *ngIf="item.icon === 'key'" class="w-4 h-4" [class.text-white]="selectedIndex === i" [class.text-blue-500]="selectedIndex !== i" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
            </svg>
          </div>

          <div class="truncate">
            <p class="font-bold text-slate-900 dark:text-white" [class.text-white]="selectedIndex === i">
              {{ item.title }}
            </p>
            <p class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 truncate" [class.text-blue-100]="selectedIndex === i">
              {{ item.description }}
            </p>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0 ml-2">
          <!-- Category Badge -->
          <span 
            [class.bg-white\/25]="selectedIndex === i"
            [class.text-white]="selectedIndex === i"
            [class.border-white\/30]="selectedIndex === i"
            [class.bg-blue-500\/10]="selectedIndex !== i && item.category === 'Pages'"
            [class.text-blue-600]="selectedIndex !== i && item.category === 'Pages'"
            [class.dark:text-blue-400]="selectedIndex !== i && item.category === 'Pages'"
            [class.border-blue-500\/20]="selectedIndex !== i && item.category === 'Pages'"
            [class.bg-indigo-500\/10]="selectedIndex !== i && item.category === 'Actions'"
            [class.text-indigo-600]="selectedIndex !== i && item.category === 'Actions'"
            [class.dark:text-indigo-400]="selectedIndex !== i && item.category === 'Actions'"
            [class.border-indigo-500\/20]="selectedIndex !== i && item.category === 'Actions'"
            [class.bg-cyan-500\/10]="selectedIndex !== i && item.category === 'Documentation'"
            [class.text-cyan-600]="selectedIndex !== i && item.category === 'Documentation'"
            [class.dark:text-cyan-400]="selectedIndex !== i && item.category === 'Documentation'"
            [class.border-cyan-500\/20]="selectedIndex !== i && item.category === 'Documentation'"
            [class.bg-purple-500\/10]="selectedIndex !== i && item.category === 'FAQ'"
            [class.text-purple-600]="selectedIndex !== i && item.category === 'FAQ'"
            [class.dark:text-purple-400]="selectedIndex !== i && item.category === 'FAQ'"
            [class.border-purple-500\/20]="selectedIndex !== i && item.category === 'FAQ'"
            [class.bg-slate-100]="selectedIndex !== i && item.category === 'Navigation'"
            [class.dark:bg-slate-800]="selectedIndex !== i && item.category === 'Navigation'"
            [class.text-slate-600]="selectedIndex !== i && item.category === 'Navigation'"
            [class.dark:text-slate-300]="selectedIndex !== i && item.category === 'Navigation'"
            class="text-[9px] sm:text-[10px] uppercase font-extrabold tracking-wider px-2 py-0.5 rounded-md border"
          >
            {{ item.category }}
          </span>

          <span *ngIf="item.shortcut" class="hidden sm:inline-block text-[11px] font-mono opacity-80" [class.text-white]="selectedIndex === i" [class.text-slate-400]="selectedIndex !== i">
            {{ item.shortcut }}
          </span>
        </div>
      </button>

    </div>

    <!-- Footer Keyboard Hints -->
    <div class="px-4 py-3 bg-slate-50 dark:bg-[#0a0e14]/90 border-t border-slate-200/80 dark:border-slate-800/80 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
      <div class="flex items-center gap-3">
        <span class="flex items-center gap-1">
          <kbd class="px-1.5 py-0.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded font-mono text-[10px]">↑</kbd>
          <kbd class="px-1.5 py-0.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded font-mono text-[10px]">↓</kbd>
          <span class="hidden sm:inline">Navigate</span>
        </span>
        <span class="flex items-center gap-1">
          <kbd class="px-1.5 py-0.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded font-mono text-[10px]">↵</kbd>
          <span class="hidden sm:inline">Select</span>
        </span>
      </div>
      <span class="font-medium text-[11px]">Ask<span class="text-blue-500">DB</span> Command Palette</span>
    </div>

  </div>
</div>
